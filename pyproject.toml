[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kbtu-data-ingestion"
version = "0.1.0"
description = "KBTU knowledge ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "scrapy>=2.19,<3", "trafilatura>=2,<3", "beautifulsoup4>=4.12,<5",
  "PyMuPDF>=1.25,<2", "python-docx>=1.1.2,<2",
  "qdrant-client>=1.14,<2", "filelock>=3.16,<4",
  "langdetect>=1.0.9,<2", "tiktoken>=0.9,<1",
  "openai>=2,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-beautifulsoup4", "httpx>=0.28,<1"]
app = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.20,<1",
       "rank-bm25>=0.2.2,<1", "snowballstemmer>=2.2,<4", "numpy>=1.26,<3"]

[project.scripts]
kbtu-ingest = "ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ingestion*", "backend*"]

[tool.setuptools.package-data]
backend = ["data/abbreviations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicit network/API tests"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve the partner's prompt, stopword and parser formatting.
"backend/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["ingestion"]
